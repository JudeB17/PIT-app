/* ---------------- session ---------------- */
function SessionView({cfg,settings,onEnd,onQuit}){
  const genQ=()=>{
    if(cfg.mode==="eighty") return genEighty();
    if(cfg.mode==="custom") return genCustom(cfg.custom);
    return genSprint(settings);
  };
  const [q,setQ]=useState(genQ);
  const [val,setVal]=useState("");
  const [tape,setTape]=useState([]);
  const [n,setN]=useState(0);
  const [now,setNow]=useState(Date.now());
  const t0=useRef(Date.now());
  const qT=useRef(Date.now());
  const recs=useRef([]);
  const inRef=useRef(null);
  const done=useRef(false);

  const elapsed=(now-t0.current)/1000;
  const remaining=cfg.dur ? cfg.dur-elapsed : null;

  useEffect(()=>{
    const iv=setInterval(()=>setNow(Date.now()),200);
    return ()=>clearInterval(iv);
  },[]);
  useEffect(()=>{
    if(done.current) return;
    const timeUp = cfg.dur && (Date.now()-t0.current)/1000 >= cfg.dur;
    const countUp = cfg.count && n>=cfg.count;
    if(timeUp||countUp){ done.current=true; finish(); }
  },[now,n]);
  useEffect(()=>{ if(inRef.current) inRef.current.focus(); },[q]);

  function record(ok,given,skipped){
    recs.current.push({text:q.text,ans:q.ans,given,ok,skipped:!!skipped,ms:Date.now()-qT.current,op:q.op});
    setTape(t=>[...t,{ok:skipped?null:ok}].slice(-60));
    setN(x=>x+1); setVal(""); qT.current=Date.now(); setQ(genQ());
  }
  function finish(){
    const r=recs.current;
    const correct=r.filter(x=>x.ok).length;
    const wrong=r.filter(x=>!x.ok&&!x.skipped).length;
    const skipped=r.filter(x=>x.skipped).length;
    const score=cfg.mode==="eighty"?correct-wrong:correct;
    const perOp={};
    r.forEach(x=>{const p=perOp[x.op]||(perOp[x.op]={n:0,ok:0,ms:0});p.n++;if(x.ok)p.ok++;p.ms+=x.ms;});
    onEnd({id:Date.now(),ts:Date.now(),mode:cfg.mode,score,attempted:r.length,correct,wrong,skipped,
      dur:Math.round((Date.now()-t0.current)/1000),perOp,cfg,recs:r.slice(-100)});
  }
  function onType(v){
    setVal(v);
    const t=v.trim();
    if(t!=="" && t!=="-" && Number(t)===q.ans) record(true,t,false);
  }
  function pickOpt(o){ record(o===q.ans,o,false); }
  function skip(){ record(false,null,true); }

  const scoreNow = cfg.mode==="eighty"
    ? recs.current.filter(x=>x.ok).length - recs.current.filter(x=>!x.ok&&!x.skipped).length
    : recs.current.filter(x=>x.ok).length;

  return (<div className="app"><div className="sess">
    <div className="tape">{tape.length===0
      ? <span className="tick flat">— tape —</span>
      : tape.map((t,i)=><span key={i} className={"tick "+(t.ok===null?"flat":t.ok?"up":"down")}>{t.ok===null?"─":t.ok?"▲":"▼"}</span>)}</div>
    <div className="sesshead">
      <div className={"clock"+(remaining!==null&&remaining<=10?" low":"")}>
        {remaining!==null ? fmtClock(remaining) : fmtClock(elapsed)}
      </div>
      <div className="score">{cfg.count?`Q ${Math.min(n+1,cfg.count)}/${cfg.count} · `:""}SCORE {scoreNow}</div>
    </div>
    <div className="qzone">
      <div className="qtext">{q.text} <small>=</small></div>
      {cfg.mode==="eighty"
        ? <div className="opts">{q.opts.map((o,i)=><button key={i} className="opt" onClick={()=>pickOpt(o)}>{fmtN(o)}</button>)}</div>
        : <input ref={inRef} className="ansin" value={val} inputMode="decimal" autoComplete="off" autoCorrect="off"
            onChange={e=>onType(e.target.value)} placeholder="—"/>}
      <button className="skip" onClick={skip}>Skip</button>
    </div>
    <button className="btn ghost small" onClick={onQuit}>Abandon session</button>
  </div></div>);
}

/* ---------------- results ---------------- */
const MODENAMES={eighty:"80 in 8",sprint:"Sprint",custom:"Custom drill"};
function ResultsView({res,onDone,onAgain}){
  const acc=res.attempted?Math.round(100*res.correct/res.attempted):0;
  const avg=res.attempted?(Object.values(res.perOp).reduce((a,p)=>a+p.ms,0)/res.attempted/1000).toFixed(1):"—";
  return (<div className="app"><div className="screen">
    <div className="eyebrow">{MODENAMES[res.mode]} · {fmtClock(res.dur)}</div>
    <div className="bigscore">{res.score}</div>
    <div style={{textAlign:"center",color:"var(--faint)",fontSize:11,letterSpacing:".18em",textTransform:"uppercase"}}>Score</div>
    <div className="statgrid">
      <div className="stat"><div className="v">{res.correct}</div><div className="k">Correct</div></div>
      <div className="stat"><div className="v">{res.wrong}</div><div className="k">Wrong</div></div>
      <div className="stat"><div className="v">{res.skipped}</div><div className="k">Skipped</div></div>
      <div className="stat"><div className="v">{acc}%</div><div className="k">Accuracy</div></div>
      <div className="stat"><div className="v">{avg}s</div><div className="k">Avg / Q</div></div>
      <div className="stat"><div className="v">{res.attempted}</div><div className="k">Attempted</div></div>
    </div>
    <div className="chartbox"><div className="charttitle">By operation</div>
      {Object.entries(res.perOp).map(([op,p])=>
        <div className="barrow" key={op}>
          <span className="barlabel">{op}</span>
          <div className="bartrack"><div className="barfill" style={{width:(p.n?Math.round(100*p.ok/p.n):0)+"%"}}/></div>
          <span className="barval">{p.ok}/{p.n} · {(p.ms/p.n/1000).toFixed(1)}s</span>
        </div>)}
    </div>
    {res.recs.some(r=>!r.ok&&!r.skipped) && <div className="chartbox"><div className="charttitle">Misses</div>
      {res.recs.filter(r=>!r.ok&&!r.skipped).slice(-12).map((r,i)=>
        <div key={i} style={{fontSize:12,padding:"4px 0",color:"var(--dim)"}}>
          {r.text} = <span style={{color:"var(--up)"}}>{fmtN(r.ans)}</span>
          {r.given!=null && <span style={{color:"var(--down)"}}> (you: {fmtN(Number(r.given))})</span>}
        </div>)}
    </div>}
    <button className="btn" onClick={onAgain} style={{marginBottom:8}}>Run it again</button>
    <button className="btn ghost" onClick={onDone}>Done</button>
  </div></div>);
}

/* ---------------- bank ---------------- */
const DIFFN={1:"Easy",2:"Med",3:"Hard"};
function BankTab({bank,onResult}){
  const [cat,setCat]=useState(null);
  const [qi,setQi]=useState(null);
  const [diff,setDiff]=useState(0);
  const filt=q=>q.cat===cat && (!diff || q.d===diff);
  if(cat && qi!==null){
    const qs=BANK.filter(filt);
    return <BankQ q={qs[qi]} idx={qi} total={qs.length} bank={bank} onResult={onResult}
      onNav={d=>setQi(Math.max(0,Math.min(qs.length-1,qi+d)))} onBack={()=>setQi(null)}/>;
  }
  if(cat){
    const qs=BANK.filter(filt);
    const cname=CATS.find(c=>c.id===cat).name;
    return (<div>
      <button className="skip" style={{padding:"0 0 8px"}} onClick={()=>{setCat(null);setDiff(0);}}>← Categories</button>
      <div className="h1">{cname}</div>
      <div className="chips">{[[0,"All"],[1,"Easy"],[2,"Med"],[3,"Hard"]].map(([v,l])=>
        <button key={v} className={"chip"+(diff===v?" on":"")} onClick={()=>{setDiff(v);setQi(null);}}>{l}</button>)}</div>
      {qs.length===0 && <div className="empty">No questions at this difficulty here.</div>}
      {qs.map((q,i)=>{
        const p=bank[q.id];
        return <div key={q.id} className="card tap" onClick={()=>setQi(i)}>
          <div className="row">
            <span className={"qdot"+(p?(p.ok?" ok":" bad"):"")}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,lineHeight:1.5}}>{q.q}</div>
              <div className="cardsub">{DIFFN[q.d]} · {q.fmt==="mc"?"Multiple choice":q.fmt==="num"?"Numeric answer":"Open response"}{p?` · ${p.tries} attempt${p.tries>1?"s":""}`:""}</div>
            </div>
          </div>
        </div>;})}
    </div>);
  }
  return (<div>
    <div className="eyebrow">Probability & Statistics</div>
    <div className="h1">Question Bank</div>
    {CATS.map(c=>{
      const qs=BANK.filter(b=>b.cat===c.id);
      const solved=qs.filter(q=>bank[q.id]&&bank[q.id].ok).length;
      return <div key={c.id} className="card tap" onClick={()=>setCat(c.id)}>
        <div className="spread"><div className="cardtitle">{c.name}</div><div className="tag">{solved}/{qs.length}</div></div>
        <div style={{marginTop:8}} className="bartrack"><div className="barfill" style={{width:(100*solved/qs.length)+"%"}}/></div>
      </div>;})}
  </div>);
}
function BankQ({q,idx,total,bank,onResult,onNav,onBack}){
  const [picked,setPicked]=useState(null);
  const [val,setVal]=useState("");
  const [checked,setChecked]=useState(null); // true/false for num
  const [revealed,setRevealed]=useState(false);
  useEffect(()=>{ setPicked(null); setVal(""); setChecked(null); setRevealed(false); },[q.id]);
  const answered = q.fmt==="mc" ? picked!==null : q.fmt==="num" ? checked!==null : revealed;
  return (<div>
    <button className="skip" style={{padding:"0 0 8px"}} onClick={onBack}>← Back</button>
    <div className="spread"><div className="eyebrow">{CATS.find(c=>c.id===q.cat).name} · {DIFFN[q.d]}</div>
      <div className="eyebrow">{idx+1} / {total}</div></div>
    <div className="prompt">{q.q}</div>

    {q.fmt==="mc" && q.opts.map((o,i)=>{
      let cls="mcopt";
      if(picked!==null){ if(i===q.ans) cls+=" right"; else if(i===picked) cls+=" wrongpick"; }
      return <button key={i} className={cls} disabled={picked!==null}
        onClick={()=>{setPicked(i); onResult(q.id, i===q.ans);}}>{String.fromCharCode(65+i)}. {o}</button>;})}

    {q.fmt==="num" && <div>
      <div className="row">
        <input style={{flex:1}} inputMode="text" placeholder="e.g. 0.25 or 1/4" value={val}
          onChange={e=>setVal(e.target.value)} disabled={checked!==null}/>
        <button className="btn small" style={{width:"auto",padding:"9px 16px"}} disabled={checked!==null||!val.trim()}
          onClick={()=>{const ok=numMatch(val,q.ans); setChecked(ok); onResult(q.id,ok);}}>Check</button>
      </div>
      {checked!==null && <div className={"verdict "+(checked?"ok":"bad")}>
        {checked?"Correct":"Wrong"} — answer: {q.disp}</div>}
    </div>}

    {q.fmt==="open" && !revealed &&
      <button className="btn ghost" onClick={()=>setRevealed(true)}>Show solution</button>}
    {q.fmt==="open" && revealed && picked===null &&
      <div className="row" style={{marginTop:10}}>
        <button className="btn small" style={{flex:1}} onClick={()=>{setPicked(1);onResult(q.id,true);}}>Had it</button>
        <button className="btn small ghost" style={{flex:1}} onClick={()=>{setPicked(0);onResult(q.id,false);}}>Missed it</button>
      </div>}

    {answered && <div className="sol">
      {q.fmt==="open" && <div style={{color:"var(--amber)",fontWeight:700,marginBottom:6}}>{q.disp}</div>}
      <span dangerouslySetInnerHTML={{__html:q.sol}}/>
    </div>}

    <div className="row" style={{marginTop:16}}>
      <button className="btn ghost small" style={{flex:1}} disabled={idx===0} onClick={()=>onNav(-1)}>← Prev</button>
      <button className="btn ghost small" style={{flex:1}} disabled={idx===total-1} onClick={()=>onNav(1)}>Next →</button>
    </div>
  </div>);
}

/* ---------------- stats ---------------- */
function LineChart({data}){
  if(data.length<2) return <div className="empty">Need at least two sessions for a trend.</div>;
  const W=320,H=110,P=8;
  const min=Math.min(...data), max=Math.max(...data);
  const span=(max-min)||1;
  const px=i=>P+(W-2*P)*i/(data.length-1);
  const py=v=>H-P-(H-2*P)*(v-min)/span;
  const path=data.map((v,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(v).toFixed(1)).join(" ");
  return (<div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
      <path d={path} fill="none" stroke="var(--amber)" strokeWidth="2"/>
      {data.map((v,i)=><circle key={i} cx={px(i)} cy={py(v)} r="2.6" fill="var(--amber)"/>)}
    </svg>
    <div className="spread" style={{fontSize:10,color:"var(--faint)"}}>
      <span>min {min}</span><span>latest {data[data.length-1]}</span><span>max {max}</span>
    </div>
  </div>);
}
function StatsTab({sessions,bank}){
  const [mode,setMode]=useState("sprint");
  const ss=sessions.filter(s=>s.mode===mode);
  const scores=ss.slice(-30).map(s=>s.score);
  const best=ss.length?Math.max(...ss.map(s=>s.score)):"—";
  const totalQ=sessions.reduce((a,s)=>a+s.attempted,0);
  const agg={};
  ss.forEach(s=>Object.entries(s.perOp||{}).forEach(([op,p])=>{
    const a=agg[op]||(agg[op]={n:0,ok:0,ms:0}); a.n+=p.n; a.ok+=p.ok; a.ms+=p.ms;}));
  const bankSolved=BANK.filter(q=>bank[q.id]&&bank[q.id].ok).length;
  return (<div>
    <div className="eyebrow">Performance</div>
    <div className="h1">Stats</div>
    <div className="chips">{[["sprint","Sprint"],["eighty","80 in 8"],["custom","Custom"]].map(([id,l])=>
      <button key={id} className={"chip"+(mode===id?" on":"")} onClick={()=>setMode(id)}>{l}</button>)}</div>
    <div className="statgrid">
      <div className="stat"><div className="v">{ss.length}</div><div className="k">Sessions</div></div>
      <div className="stat"><div className="v">{best}</div><div className="k">Best</div></div>
      <div className="stat"><div className="v">{totalQ}</div><div className="k">Total Qs</div></div>
    </div>
    <div className="chartbox"><div className="charttitle">Score — last {scores.length} sessions</div>
      <LineChart data={scores}/></div>
    <div className="chartbox"><div className="charttitle">Accuracy & speed by operation</div>
      {Object.keys(agg).length===0
        ? <div className="empty">No sessions in this mode yet.</div>
        : Object.entries(agg).map(([op,p])=>
        <div className="barrow" key={op}>
          <span className="barlabel">{op}</span>
          <div className="bartrack"><div className="barfill" style={{width:Math.round(100*p.ok/p.n)+"%"}}/></div>
          <span className="barval">{Math.round(100*p.ok/p.n)}% · {(p.ms/p.n/1000).toFixed(1)}s</span>
        </div>)}
    </div>
    <div className="chartbox"><div className="charttitle">Bank mastery — {bankSolved}/{BANK.length}</div>
      {CATS.map(c=>{
        const qs=BANK.filter(b=>b.cat===c.id);
        const ok=qs.filter(q=>bank[q.id]&&bank[q.id].ok).length;
        return <div className="barrow" key={c.id}>
          <span className="barlabel" style={{width:90,textTransform:"none",letterSpacing:0}}>{c.name.split(" ")[0]}</span>
          <div className="bartrack"><div className="barfill" style={{width:(100*ok/qs.length)+"%"}}/></div>
          <span className="barval">{ok}/{qs.length}</span>
        </div>;})}
    </div>
  </div>);
}

/* ---------------- setup ---------------- */
function Range({v,onChange}){
  return (<div className="row">
    <input className="rangein" inputMode="numeric" value={v[0]} onChange={e=>onChange([+e.target.value||0,v[1]])}/>
    <span style={{color:"var(--faint)"}}>–</span>
    <input className="rangein" inputMode="numeric" value={v[1]} onChange={e=>onChange([v[0],+e.target.value||0])}/>
  </div>);
}
function Switch({on,onToggle}){
  return <button className={"switch"+(on?" on":"")} onClick={onToggle}><span className="knob"/></button>;
}
function SetupTab({st,setSt,onSettings}){
  const s=st.settings;
  const set=patch=>onSettings(x=>({...x,...patch}));
  const doExport=()=>{
    const blob=new Blob([JSON.stringify(st,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="pit-data.json"; a.click();
  };
  const doImport=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ setSt(JSON.parse(r.result)); }catch(err){ alert("Invalid file"); } };
    r.readAsText(f);
  };
  const doReset=()=>{ if(confirm("Wipe all sessions, bank progress and settings?")){ localStorage.removeItem(LS); setSt(loadState()); } };
  return (<div>
    <div className="eyebrow">Configuration</div>
    <div className="h1">Setup</div>
    <div className="card">
      <div className="cardtitle" style={{marginBottom:4}}>Sprint</div>
      <div className="setrow"><span>Duration</span>
        <select value={s.sprintDur} onChange={e=>set({sprintDur:+e.target.value})}>
          {[30,60,120,300].map(d=><option key={d} value={d}>{d}s</option>)}
        </select></div>
      <div className="setrow"><span>Addition</span><Switch on={s.ops.add} onToggle={()=>set({ops:{...s.ops,add:!s.ops.add}})}/></div>
      <div className="setrow"><span style={{color:"var(--dim)",fontSize:12}}>Addend A range</span><Range v={s.addA} onChange={v=>set({addA:v})}/></div>
      <div className="setrow"><span style={{color:"var(--dim)",fontSize:12}}>Addend B range</span><Range v={s.addB} onChange={v=>set({addB:v})}/></div>
      <div className="setrow"><span>Subtraction <span style={{color:"var(--faint)"}}>(inverse)</span></span><Switch on={s.ops.sub} onToggle={()=>set({ops:{...s.ops,sub:!s.ops.sub}})}/></div>
      <div className="setrow"><span>Multiplication</span><Switch on={s.ops.mul} onToggle={()=>set({ops:{...s.ops,mul:!s.ops.mul}})}/></div>
      <div className="setrow"><span style={{color:"var(--dim)",fontSize:12}}>Factor A range</span><Range v={s.mulA} onChange={v=>set({mulA:v})}/></div>
      <div className="setrow"><span style={{color:"var(--dim)",fontSize:12}}>Factor B range</span><Range v={s.mulB} onChange={v=>set({mulB:v})}/></div>
      <div className="setrow"><span>Division <span style={{color:"var(--faint)"}}>(inverse)</span></span><Switch on={s.ops.div} onToggle={()=>set({ops:{...s.ops,div:!s.ops.div}})}/></div>
    </div>
    <div className="card">
      <div className="cardtitle" style={{marginBottom:8}}>Data</div>
      <button className="btn ghost small" style={{marginBottom:8}} onClick={doExport}>Export data (JSON)</button>
      <label className="btn ghost small" style={{marginBottom:8,display:"block"}}>Import data
        <input type="file" accept="application/json" style={{display:"none"}} onChange={doImport}/></label>
      <button className="btn ghost small" style={{color:"var(--down)"}} onClick={doReset}>Reset everything</button>
    </div>
    <div className="cardsub" style={{textAlign:"center"}}>PIT · sessions and bank progress live in localStorage on this device.</div>
  </div>);
}

if (typeof window!=="undefined") window.__pit={genSprint,genEighty,genCustom,numMatch,parseAns,BANK,DEFAULTS,distractors};
if (typeof document!=="undefined" && document.getElementById("root")){
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
}
</script>
</body>
